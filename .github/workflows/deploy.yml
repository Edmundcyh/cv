name: Deploy site

# Builds the page with fresh supply chain headlines and publishes it to
# GitHub Pages. Requires repo → Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * *"  # daily at 06:17 Kuala Lumpur time (22:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build site with latest news
        run: |
          mkdir _site
          cp -r 404.html favicon.svg images _site/
          python3 news/build.py index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
