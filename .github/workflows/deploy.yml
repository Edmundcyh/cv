name: Deploy site

# Builds the page with fresh supply chain headlines and publishes it to
# GitHub Pages. Requires repo → Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    # 22:17 UTC is 06:17 Kuala Lumpur time. GitHub often starts scheduled runs
    # a few hours late, so in practice the news refreshes mid-morning in KL.
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Building and publishing are separate jobs. If only the publish fails,
  # "Re-run failed jobs" publishes the same build without uploading it again.
  # The uploaded site expires after a day, so after that use "Run workflow".
  # Avoid "Re-run all jobs": it uploads a second copy and the publish then
  # stops with "Multiple artifacts".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build site with latest news
        run: |
          mkdir _site
          cp -r 404.html favicon.svg images _site/
          python3 news/build.py index.html _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # GitHub's artifact listing occasionally comes back empty right after an
      # upload (actions/deploy-pages#451), so give it one more try.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
